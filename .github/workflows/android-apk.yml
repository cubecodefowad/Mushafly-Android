name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Documentation-only commits do not change the APK, so they do not spend a
    # runner on rebuilding it.
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify data, types and tests
        run: npm run verify

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/*.apk artifacts/mushafly.apk
          ls -lh artifacts/mushafly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mushafly-apk
          path: artifacts/mushafly.apk
          if-no-files-found: error
